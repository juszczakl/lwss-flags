<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LWSS Flag Stadium</title>

<style>

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1721;
}

.stage {
  position:relative;
  width:100vw;
  height:100vh;

  background-image:
    url("ChatGPT Image Sep 28, 2026, 03_14_50 PM.png");

  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  overflow:hidden;
}

.header {
  position:absolute;
  z-index:300;
  top:2.5%;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  text-align:center;
}

.header h1 {
  margin:0;
  font-size:clamp(30px,3.4vw,60px);
  color:#123452;
  font-weight:800;
  text-shadow:0 2px 4px rgba(255,255,255,.9);
}

.counter {
  display:inline-block;
  margin-top:9px;
  padding:7px 17px;
  border-radius:30px;
  background:rgba(15,48,75,.9);
  color:white;
  font-size:15px;
  font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.flags-layer {
  position:absolute;
  inset:0;
  z-index:150;
  pointer-events:none;
}

.flag {
  position:absolute;
  opacity:0;
  transform:translateY(45px) scale(.7);
  transform-origin:center bottom;

  transition:
    opacity .45s ease,
    transform .85s cubic-bezier(.2,.9,.2,1.15);
}

.flag.revealed {
  opacity:1;
  transform:translateY(0) scale(1);
}

.flag-pole {
  position:absolute;
  left:-4px;
  top:-5px;
  width:3px;
  height:calc(100% + 15px);
  border-radius:2px;
  background:#e4e7e8;
  box-shadow:1px 1px 3px rgba(0,0,0,.6);
}

.flag-art {
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  border:2px solid rgba(255,255,255,.96);
  box-shadow:2px 4px 9px rgba(0,0,0,.55);
  transform-origin:left center;
}

.flag-art img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}

.flag.revealed .flag-art {
  animation:gentleWave 3.8s ease-in-out infinite;
}

@keyframes gentleWave {

  0%,100% {
    transform:
      perspective(500px)
      rotateY(0deg)
      skewY(0deg);
  }

  25% {
    transform:
      perspective(500px)
      rotateY(-5deg)
      skewY(.45deg);
  }

  50% {
    transform:
      perspective(500px)
      rotateY(2deg)
      skewY(-.3deg);
  }

  75% {
    transform:
      perspective(500px)
      rotateY(-2deg)
      skewY(.2deg);
  }
}

.controls {
  position:fixed;
  z-index:600;
  right:12px;
  bottom:12px;
  display:flex;
  gap:7px;
  padding:8px;
  border-radius:11px;
  background:rgba(7,19,29,.9);
  box-shadow:0 4px 15px rgba(0,0,0,.35);
}

.controls button {
  border:0;
  border-radius:7px;
  padding:9px 12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.primary {
  background:#d4aa4b;
  color:#172b3d;
}

.secondary {
  background:#f0f3f4;
  color:#17334c;
}

.status {
  position:fixed;
  z-index:600;
  left:12px;
  bottom:12px;
  padding:7px 10px;
  border-radius:7px;
  background:rgba(5,15,22,.82);
  color:white;
  font-size:12px;
}

.final-overlay {
  position:fixed;
  z-index:1000;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(6,18,28,.82);
}

.final-card {
  width:min(850px,86vw);
  min-height:230px;
  padding:40px;
  border-radius:22px;
  background:rgba(255,255,255,.97);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#153854;
  font-size:clamp(28px,3vw,48px);
  font-weight:800;
  box-shadow:0 18px 55px rgba(0,0,0,.45);
}

</style>
</head>

<body>

<main class="stage">

  <header class="header">

    <h1>
      Different roles. Diverse strengths.
    </h1>

    <div class="counter">
      Flags Ready:
      <span id="flagCount">0</span>
    </div>

  </header>

  <div
    id="flagsLayer"
    class="flags-layer">
  </div>

</main>


<div
  id="status"
  class="status">
  Connecting...
</div>


<div
  id="controls"
  class="controls">

  <button
    id="startButton"
    class="secondary">
    Start New Activity
  </button>

  <button
    id="refreshButton"
    class="secondary">
    Refresh
  </button>

  <button
    id="revealButton"
    class="primary">
    Reveal Flags
  </button>

  <button
    id="finalButton"
    class="secondary">
    Final Message
  </button>

  <button
    id="resetButton"
    class="secondary">
    Reset Display
  </button>

  <button
    id="hideButton"
    class="secondary">
    Hide Controls
  </button>

</div>


<div
  id="finalOverlay"
  class="final-overlay">

  <div
    id="finalCard"
    class="final-card">
  </div>

</div>

/* =========================================
   IMAGE URL
========================================= */

function getImageURL(
  imagePath
) {

  return db
    .storage
    .from("flags")
    .getPublicUrl(
      imagePath
    )
    .data
    .publicUrl;
}


/* =========================================
   GET CURRENT ACTIVITY
========================================= */

async function getCurrentActivity() {

  const result =
    await db
      .from("activity_state")
      .select("current_activity_id")
      .eq("id",1)
      .single();


  if (result.error) {

    console.error(
      result.error
    );

    statusBox.textContent =
      "Unable to load activity.";

    return false;
  }


  currentActivityId =
    result.data.current_activity_id;


  return true;
}


/* =========================================
   LOAD CURRENT ACTIVITY FLAGS
========================================= */

async function loadFlags() {

  statusBox.textContent =
    "Loading flags...";


  if (!currentActivityId) {

    const ready =
      await getCurrentActivity();

    if (!ready) {
      return;
    }
  }


  const result =
    await db
      .from("submissions")
      .select(
        "id,created_at,name,image_path,activity_id"
      )
      .eq(
        "activity_id",
        currentActivityId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if (result.error) {

    console.error(
      result.error
    );

    statusBox.textContent =
      "Unable to load flags.";

    return;
  }


  submissions =
    result.data || [];


  flagCount.textContent =
    submissions.length;


  drawFlags();


  statusBox.textContent =
    "Connected";
}


/* =========================================
   DRAW FLAGS
========================================= */

function drawFlags() {

  flagsLayer.innerHTML =
    "";


  submissions
    .slice(
      0,
      positions.length
    )
    .forEach(
      function(
        submission,
        index
      ) {

        const position =
          positions[index];


        const flag =
          document.createElement(
            "div"
          );


        flag.className =
          "flag";


        flag.style.left =
          position.x + "%";


        flag.style.top =
          position.y + "%";


        flag.style.width =
          position.w + "%";


        flag.style.height =
          position.h + "%";


        flag.innerHTML = `

          <div class="flag-pole"></div>

          <div class="flag-art">

            <img
              src="${getImageURL(
                submission.image_path
              )}"
              alt="Participant flag"
            >

          </div>

        `;


        flagsLayer.appendChild(
          flag
        );


        if (revealed) {

          requestAnimationFrame(
            function() {

              flag.classList.add(
                "revealed"
              );

            }
          );
        }

      }
    );
}


/* =========================================
   REVEAL
========================================= */

function revealFlags() {

  revealed =
    true;


  const flags =
    document.querySelectorAll(
      ".flag"
    );


  flags.forEach(
    function(
      flag,
      index
    ) {

      setTimeout(
        function() {

          flag.classList.add(
            "revealed"
          );

        },

        index * 55
      );

    }
  );


  document
    .getElementById(
      "revealButton"
    )
    .textContent =
      "Flags Revealed";
}


/* =========================================
   RESET DISPLAY
========================================= */

function resetDisplay() {

  revealed =
    false;


  document
    .querySelectorAll(
      ".flag"
    )
    .forEach(
      function(flag) {

        flag.classList.remove(
          "revealed"
        );

      }
    );


  document
    .getElementById(
      "revealButton"
    )
    .textContent =
      "Reveal Flags";


  document
    .getElementById(
      "finalOverlay"
    )
    .style
    .display =
      "none";
}


/* =========================================
   START NEW ACTIVITY

   Creates a new activity ID.
   Does NOT delete old submissions.
========================================= */

async function startNewActivity() {

  const confirmed =
    window.confirm(
      "Start a new activity? The current stadium will be cleared, but previous submissions will not be deleted."
    );


  if (!confirmed) {
    return;
  }


  statusBox.textContent =
    "Starting new activity...";


  const newActivityId =
    "activity-" +
    Date.now() +
    "-" +
    Math.random()
      .toString(36)
      .slice(2,8);


  const result =
    await db
      .from("activity_state")
      .update({
        current_activity_id:
          newActivityId,

        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        1
      )
      .select();


  if (result.error) {

    console.error(
      result.error
    );

    statusBox.textContent =
      "Could not start new activity.";

    return;
  }


  currentActivityId =
    newActivityId;


  submissions =
    [];


  resetDisplay();


  drawFlags();


  flagCount.textContent =
    "0";


  statusBox.textContent =
    "New activity ready";
}


/* =========================================
   REALTIME NEW SUBMISSIONS
========================================= */

db
  .channel(
    "lwss-stadium-live"
  )

  .on(
    "postgres_changes",

    {
      event:"INSERT",
      schema:"public",
      table:"submissions"
    },

    function(payload) {

      /*
        Ignore submissions belonging
        to older activity sessions.
      */

      if (
        payload.new.activity_id !==
        currentActivityId
      ) {

        return;
      }


      const exists =
        submissions.some(
          function(submission) {

            return (
              submission.id ===
              payload.new.id
            );

          }
        );


      if (exists) {
        return;
      }


      submissions.push(
        payload.new
      );


      flagCount.textContent =
        submissions.length;


      drawFlags();


      /*
        If the presenter already revealed
        the flags, late submissions appear
        automatically.
      */

      if (revealed) {

        statusBox.textContent =
          "New flag added!";


        setTimeout(
          function() {

            statusBox.textContent =
              "Connected";

          },

          1600
        );
      }

    }
  )

  .subscribe();


/* =========================================
   BUTTONS
========================================= */

document

  )

    "click",
    revealFlags
  );


document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    async function() {

      await getCurrentActivity();

      await loadFlags();

    }
  );


document
  .getElementById(
    "resetButton"
  )
  .addEventListener(
    "click",
    resetDisplay
  );


document
  .getElementById(
    "startButton"
  )
  .addEventListener(
    "click",
    startNewActivity
  );


document
  .getElementById(
    "hideButton"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "controls"
        )
        .style
        .display =
          "none";


      statusBox
        .style
        .display =
          "none";

    }
  );


document
  .getElementById(
    "finalButton"
  )
  .addEventListener(
    "click",
    function() {

      /*
        Final message intentionally
        remains blank until you choose
        the wording.
      */

      document
        .getElementById(
          "finalCard"
        )
        .textContent =
          "";


      document
        .getElementById(
          "finalOverlay"
        )
        .style
        .display =
          "flex";

    }
  );


document
  .getElementById(
    "finalOverlay"
  )
  .addEventListener(
    "click",
    function() {

      document
        .getElementById(
          "finalOverlay"
        )
        .style
        .display =
          "none";

    }
  );


/* =========================================
   START PAGE
========================================= */

async function initialize() {

  const ready =
    await getCurrentActivity();


  if (ready) {

    await loadFlags();

  }
}


initialize();

</script>
