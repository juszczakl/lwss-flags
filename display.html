<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LWSS Flag Stadium</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at center, #244b65 0%, #102a40 55%, #081b2a 100%);
  color: white;
}

/* HEADER */

.header {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 24px 30px 12px;
  text-align: center;
  z-index: 20;
}

.header h1 {
  margin: 0;
  font-size: clamp(28px, 4vw, 58px);
  letter-spacing: 0.5px;
  text-shadow: 0 3px 8px rgba(0,0,0,.45);
}

.counter {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(0,0,0,.32);
  font-size: 17px;
  font-weight: 700;
}

/* STADIUM */

.stadium {
  position: absolute;
  left: 3%;
  right: 3%;
  top: 16%;
  bottom: 4%;
  border-radius: 48% 48% 22% 22% / 24% 24% 16% 16%;
  background:
    repeating-linear-gradient(
      0deg,
      #304d61 0px,
      #304d61 30px,
      #38586d 31px,
      #38586d 56px
    );
  border: 8px solid #b88a35;
  box-shadow:
    inset 0 0 60px rgba(0,0,0,.5),
    0 20px 60px rgba(0,0,0,.55);
  overflow: hidden;
}

/* FIELD */

.field {
  position: absolute;
  width: 54%;
  height: 45%;
  left: 23%;
  top: 35%;
  border: 4px solid rgba(255,255,255,.9);
  background:
    repeating-linear-gradient(
      90deg,
      #4c8a4d 0%,
      #4c8a4d 10%,
      #559652 10%,
      #559652 20%
    );
  box-shadow: 0 8px 25px rgba(0,0,0,.45);
}

.field::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  height: 100%;
  border-left: 3px solid rgba(255,255,255,.85);
}

.field::after {
  content: "";
  position: absolute;
  width: 22%;
  aspect-ratio: 1;
  left: 39%;
  top: 50%;
  transform: translateY(-50%);
  border: 3px solid rgba(255,255,255,.85);
  border-radius: 50%;
}

/* FLAGS */

.flags-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.flag {
  position: absolute;
  width: clamp(80px, 8vw, 145px);
  opacity: 0;
  transform: translateY(90px) scale(.75);
  transform-origin: bottom left;
  transition:
    opacity .7s ease,
    transform 1.1s cubic-bezier(.2,.8,.2,1);
}

.flag.revealed {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.flag-pole {
  position: absolute;
  left: 0;
  top: 4px;
  width: 4px;
  height: 92px;
  border-radius: 3px;
  background: #e4e8eb;
  box-shadow: 1px 1px 3px rgba(0,0,0,.5);
}

.flag-image-wrap {
  position: relative;
  left: 4px;
  width: 100%;
  overflow: hidden;
  transform-origin: left center;
}

.flag.revealed .flag-image-wrap {
  animation: gentleWave 3.4s ease-in-out infinite;
}

.flag img {
  display: block;
  width: 100%;
  aspect-ratio: 12 / 7;
  object-fit: cover;
  border-radius: 1px 5px 5px 1px;
  box-shadow: 3px 4px 8px rgba(0,0,0,.4);
}

@keyframes gentleWave {
  0% {
    transform: perspective(500px) rotateY(0deg) skewY(0deg);
  }

  25% {
    transform: perspective(500px) rotateY(-4deg) skewY(.6deg);
  }

  50% {
    transform: perspective(500px) rotateY(2deg) skewY(-.4deg);
  }

  75% {
    transform: perspective(500px) rotateY(-2deg) skewY(.3deg);
  }

  100% {
    transform: perspective(500px) rotateY(0deg) skewY(0deg);
  }
}

/* CONTROLS */

.controls {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  display: flex;
  gap: 8px;
  padding: 10px;
  border-radius: 14px;
  background: rgba(7,20,31,.88);
  box-shadow: 0 5px 20px rgba(0,0,0,.4);
}

.controls button {
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #c5963b;
  color: #10263a;
}

.secondary {
  background: #e9eef1;
  color: #17334b;
}

.status {
  position: fixed;
  left: 18px;
  bottom: 18px;
  z-index: 50;
  padding: 9px 14px;
  border-radius: 10px;
  background: rgba(0,0,0,.42);
  font-size: 13px;
}

@media (max-width: 700px) {
  .stadium {
    left: 1%;
    right: 1%;
  }

  .field {
    width: 64%;
    left: 18%;
  }

  .controls {
    right: 8px;
    bottom: 8px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>Different roles. Diverse strengths.</h1>

  <div class="counter">
    Flags Ready: <span id="flagCount">0</span>
  </div>
</header>

<main class="stadium">

  <div class="field"></div>

  <div
    id="flagsLayer"
    class="flags-layer">
  </div>

</main>

<div class="status" id="status">
  Connecting...
</div>

<div class="controls" id="controls">

  <button
    id="refreshButton"
    class="secondary">
    Refresh
  </button>

  <button
    id="revealButton"
    class="primary">
    Reveal Flags
  </button>

  <button
    id="hideButton"
    class="secondary">
    Hide Controls
  </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://oooanvnjvuwzsqocwzjs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4lDV3RGlIGFgNVHiTUvhhg_Gk0UFP-8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   ELEMENTS
========================================== */

const flagsLayer =
  document.getElementById("flagsLayer");

const flagCount =
  document.getElementById("flagCount");

const status =
  document.getElementById("status");

const revealButton =
  document.getElementById("revealButton");

const refreshButton =
  document.getElementById("refreshButton");

const hideButton =
  document.getElementById("hideButton");

const controls =
  document.getElementById("controls");


let submissions = [];

let revealed = false;


/* ==========================================
   FLAG POSITIONS

   Positions are percentages inside stadium.
   Up to 75 positions are generated around
   the upper and side stands.
========================================== */

function createPositions() {

  const positions = [];

  const rows = [
    {
      count: 19,
      startX: 6,
      endX: 88,
      y: 9
    },
    {
      count: 18,
      startX: 8,
      endX: 87,
      y: 18
    },
    {
      count: 16,
      startX: 5,
      endX: 89,
      y: 27
    }
  ];

  rows.forEach(function(row) {

    for (
      let i = 0;
      i < row.count;
      i++
    ) {

      const progress =
        row.count === 1
          ? 0
          : i / (row.count - 1);

      positions.push({
        x:
          row.startX +
          (
            row.endX -
            row.startX
          ) *
          progress,

        y: row.y
      });
    }
  });


  /* LEFT SIDE */

  for (let i = 0; i < 11; i++) {

    positions.push({
      x: 3 + (i % 2) * 5,
      y: 37 + i * 4.1
    });
  }


  /* RIGHT SIDE */

  for (let i = 0; i < 11; i++) {

    positions.push({
      x: 88 + (i % 2) * 5,
      y: 37 + i * 4.1
    });
  }


  return positions.slice(0,75);
}


const flagPositions =
  createPositions();


/* ==========================================
   LOAD SUBMISSIONS
========================================== */

async function loadSubmissions() {

  status.textContent =
    "Loading flags...";

  const result =
    await supabaseClient
      .from("submissions")
      .select(
        "id, created_at, name, image_path"
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (result.error) {

    console.error(
      result.error
    );

    status.textContent =
      "Unable to load flags.";

    return;
  }


  submissions =
    result.data || [];


  flagCount.textContent =
    submissions.length;


  renderFlags();


  status.textContent =
    "Connected";
}


/* ==========================================
   PUBLIC IMAGE URL
========================================== */

function getFlagURL(imagePath) {

  const result =
    supabaseClient
      .storage
      .from("flags")
      .getPublicUrl(imagePath);


  return result
    .data
    .publicUrl;
}


/* ==========================================
   RENDER
========================================== */

function renderFlags() {

  flagsLayer.innerHTML = "";


  submissions
    .slice(0,75)
    .forEach(
      function(submission,index) {

        const position =
          flagPositions[index];

        if (!position) {
          return;
        }


        const flag =
          document.createElement("div");

        flag.className =
          "flag";


        flag.style.left =
          position.x + "%";

        flag.style.top =
          position.y + "%";


        flag.style.zIndex =
          10 + index;


        flag.style.transitionDelay =
          (
            index * 45
          ) + "ms";


        flag.innerHTML = `
          <div class="flag-pole"></div>

          <div class="flag-image-wrap">
            <img
              src="${getFlagURL(
                submission.image_path
              )}"
              alt="Participant flag"
            >
          </div>
        `;


        flagsLayer.appendChild(
          flag
        );


        if (revealed) {

          requestAnimationFrame(
            function() {

              flag.classList.add(
                "revealed"
              );

            }
          );
        }
      }
    );
}


/* ==========================================
   REVEAL
========================================== */

function revealFlags() {

  revealed = true;


  const flags =
    document.querySelectorAll(
      ".flag"
    );


  flags.forEach(
    function(flag,index) {

      setTimeout(
        function() {

          flag.classList.add(
            "revealed"
          );

        },

        index * 60
      );
    }
  );


  revealButton.textContent =
    "Flags Revealed";
}


/* ==========================================
   REALTIME

   New submissions automatically join after
   reveal. Before reveal, only the counter
   changes.
========================================== */

supabaseClient
  .channel(
    "lwss-submissions"
  )

  .on(
    "postgres_changes",

    {
      event: "INSERT",
      schema: "public",
      table: "submissions"
    },

    function(payload) {

      const alreadyExists =
        submissions.some(
          function(item) {
            return (
              item.id ===
              payload.new.id
            );
          }
        );


      if (alreadyExists) {
        return;
      }


      submissions.push(
        payload.new
      );


      flagCount.textContent =
        submissions.length;


      renderFlags();


      if (revealed) {

        status.textContent =
          "New flag added!";

        setTimeout(
          function() {

            status.textContent =
              "Connected";

          },
          1800
        );
      }
    }
  )

  .subscribe(
    function(subscriptionStatus) {

      if (
        subscriptionStatus ===
        "SUBSCRIBED"
      ) {

        status.textContent =
          "Connected";
      }
    }
  );


/* ==========================================
   CONTROLS
========================================== */

revealButton.addEventListener(
  "click",
  revealFlags
);


refreshButton.addEventListener(
  "click",
  loadSubmissions
);


hideButton.addEventListener(
  "click",
  function() {

    controls.style.display =
      "none";

    status.style.display =
      "none";
  }
);


/* ==========================================
   START
========================================== */

loadSubmissions();

</script>

</body>
</html>
