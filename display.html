<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LWSS — Different roles. Diverse strengths.</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#c8e4f4;
}

body{
  perspective:1200px;
}

/* ===== SKY ===== */

.sky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at 18% 12%,rgba(255,255,255,.85) 0 4%,transparent 11%),
    radial-gradient(ellipse at 76% 10%,rgba(255,255,255,.7) 0 5%,transparent 13%),
    linear-gradient(#78b9e1 0%,#cde8f5 27%,#dcecf3 34%,#cad4d8 34.2%);
}

/* ===== TITLE ===== */

.title{
  position:absolute;
  z-index:100;
  top:3.2%;
  left:0;
  width:100%;
  text-align:center;
  color:#183c60;
}

.title h1{
  margin:0;
  font-size:clamp(31px,3.6vw,62px);
  font-weight:800;
  letter-spacing:.2px;
  text-shadow:0 2px 1px rgba(255,255,255,.5);
}

.counter{
  display:inline-block;
  margin-top:10px;
  padding:7px 18px;
  border-radius:25px;
  background:rgba(20,55,84,.88);
  color:white;
  font-size:15px;
  font-weight:700;
}

/* ===== STADIUM SHELL ===== */

.stadium{
  position:absolute;
  left:0;
  right:0;
  top:17%;
  bottom:0;
  overflow:hidden;
  background:#11191f;
}

/* roof shadow */

.roof{
  position:absolute;
  z-index:12;
  top:0;
  left:-4%;
  width:108%;
  height:11%;
  background:
    linear-gradient(
      to bottom,
      #202a30 0%,
      #0d1317 55%,
      #05090b 100%
    );
  clip-path:polygon(0 0,100% 0,93% 100%,7% 100%);
}

.lights{
  position:absolute;
  z-index:14;
  top:8.7%;
  left:8%;
  width:84%;
  height:2px;
  background:white;
  box-shadow:
    0 0 4px white,
    0 0 12px white,
    0 0 22px rgba(255,255,255,.7);
}

/* ===== BACK SEATING ===== */

.back-upper{
  position:absolute;
  z-index:3;
  left:8%;
  top:9%;
  width:84%;
  height:24%;

  clip-path:polygon(
    4% 0,
    96% 0,
    100% 100%,
    0 100%
  );

  background:
    repeating-linear-gradient(
      to bottom,
      #252d32 0 7px,
      #3d484f 8px 11px,
      #171e22 12px 19px
    );
}

.back-middle{
  position:absolute;
  z-index:4;
  left:11%;
  top:29%;
  width:78%;
  height:18%;

  clip-path:polygon(
    0 0,
    100% 0,
    94% 100%,
    6% 100%
  );

  background:
    repeating-linear-gradient(
      to bottom,
      #303a40 0 8px,
      #4c575d 9px 12px,
      #192126 13px 22px
    );

  border-top:5px solid #747e82;
}

/* ===== SIDE SEATING ===== */

.left-upper{
  position:absolute;
  z-index:5;
  left:0;
  top:12%;
  width:27%;
  height:58%;

  clip-path:polygon(
    0 0,
    100% 25%,
    78% 100%,
    0 92%
  );

  background:
    repeating-linear-gradient(
      164deg,
      #20282d 0 10px,
      #465158 11px 15px,
      #141a1e 16px 26px
    );
}

.right-upper{
  position:absolute;
  z-index:5;
  right:0;
  top:12%;
  width:27%;
  height:58%;

  clip-path:polygon(
    0 25%,
    100% 0,
    100% 92%,
    22% 100%
  );

  background:
    repeating-linear-gradient(
      16deg,
      #20282d 0 10px,
      #465158 11px 15px,
      #141a1e 16px 26px
    );
}

.left-lower{
  position:absolute;
  z-index:8;
  left:0;
  bottom:0;
  width:26%;
  height:51%;

  clip-path:polygon(
    0 0,
    100% 17%,
    72% 100%,
    0 100%
  );

  background:
    repeating-linear-gradient(
      165deg,
      #293238 0 13px,
      #59636a 14px 18px,
      #171e22 19px 32px
    );
}

.right-lower{
  position:absolute;
  z-index:8;
  right:0;
  bottom:0;
  width:26%;
  height:51%;

  clip-path:polygon(
    0 17%,
    100% 0,
    100% 100%,
    28% 100%
  );

  background:
    repeating-linear-gradient(
      15deg,
      #293238 0 13px,
      #59636a 14px 18px,
      #171e22 19px 32px
    );
}

/* ===== FIELD ===== */

.pitch-wrap{
  position:absolute;
  z-index:6;
  left:18%;
  top:43%;
  width:64%;
  height:57%;

  clip-path:polygon(
    22% 0,
    78% 0,
    100% 100%,
    0 100%
  );

  filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));
}

.pitch{
  position:absolute;
  inset:0;

  background:
    repeating-linear-gradient(
      90deg,
      #56963e 0%,
      #56963e 10%,
      #6aa84a 10%,
      #6aa84a 20%
    );
}

.pitch-border{
  position:absolute;
  left:6%;
  right:6%;
  top:6%;
  bottom:5%;

  clip-path:polygon(
    18% 0,
    82% 0,
    100% 100%,
    0 100%
  );

  border:3px solid rgba(255,255,255,.95);
}

.half-line{
  position:absolute;
  left:50%;
  top:5%;
  height:91%;
  width:2px;
  background:white;
  transform:rotate(0deg);
}

.center-circle{
  position:absolute;
  left:42%;
  top:39%;
  width:16%;
  aspect-ratio:1;
  border:2px solid white;
  border-radius:50%;
}

.center-dot{
  position:absolute;
  left:49.7%;
  top:49%;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
}

/* ===== FRONT RAIL ===== */

.front-rail{
  position:absolute;
  z-index:60;
  left:2%;
  right:2%;
  bottom:3%;
  height:10px;
  border-radius:4px;
  background:#aeb7bb;
  box-shadow:
    0 3px 4px rgba(0,0,0,.55),
    inset 0 2px 1px rgba(255,255,255,.7);
}

.front-rail::before{
  content:"";
  position:absolute;
  left:5%;
  top:-70px;
  width:7px;
  height:75px;
  background:#8f999e;
  box-shadow:
    18vw 0 #8f999e,
    36vw 0 #8f999e,
    54vw 0 #8f999e,
    72vw 0 #8f999e,
    88vw 0 #8f999e;
}

/* ===== FLAGS ===== */

#flags{
  position:absolute;
  z-index:30;
  inset:0;
  pointer-events:none;
}

.flag{
  position:absolute;
  opacity:0;

  transform:
    translateY(55px)
    scale(.65);

  transform-origin:left bottom;

  transition:
    opacity .45s ease,
    transform .85s cubic-bezier(.2,.9,.2,1.15);
}

.flag.show{
  opacity:1;

  transform:
    translateY(0)
    scale(1);
}

.pole{
  position:absolute;
  left:-4px;
  top:-5px;
  width:3px;
  height:calc(100% + 18px);
  background:#d5d9db;
  box-shadow:1px 1px 2px rgba(0,0,0,.7);
}

.art{
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  border:2px solid white;
  box-shadow:2px 4px 7px rgba(0,0,0,.6);
  transform-origin:left center;
}

.art img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.flag.show .art{
  animation:wave 3.6s ease-in-out infinite;
}

@keyframes wave{
  0%,100%{
    transform:
      perspective(500px)
      rotateY(0deg);
  }

  25%{
    transform:
      perspective(500px)
      rotateY(-5deg)
      skewY(.5deg);
  }

  50%{
    transform:
      perspective(500px)
      rotateY(2deg)
      skewY(-.3deg);
  }

  75%{
    transform:
      perspective(500px)
      rotateY(-2deg);
  }
}

/* ===== CONTROLS ===== */

.controls{
  position:fixed;
  z-index:500;
  right:12px;
  bottom:12px;
  display:flex;
  gap:7px;
  padding:8px;
  border-radius:11px;
  background:rgba(7,18,27,.88);
}

button{
  border:0;
  border-radius:7px;
  padding:9px 12px;
  font-weight:700;
  cursor:pointer;
}

.reveal{
  background:#d6ac4d;
  color:#172b3d;
}

.other{
  background:#f0f3f4;
  color:#17334c;
}

.status{
  position:fixed;
  z-index:500;
  left:12px;
  bottom:12px;
  padding:7px 10px;
  border-radius:7px;
  background:rgba(5,15,22,.8);
  color:white;
  font-size:12px;
}

/* ===== FINAL MESSAGE ===== */

.final{
  position:fixed;
  z-index:1000;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(7,19,29,.82);
}

.final-box{
  width:min(850px,85vw);
  min-height:230px;
  border-radius:20px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
  color:#183b5c;
  font-size:34px;
  font-weight:800;
  text-align:center;
}
</style>
</head>

<body>

<div class="sky"></div>

<div class="title">
  <h1>Different roles. Diverse strengths.</h1>

  <div class="counter">
    Flags Ready:
    <span id="count">0</span>
  </div>
</div>

<main class="stadium">

  <div class="roof"></div>
  <div class="lights"></div>

  <div class="back-upper"></div>
  <div class="back-middle"></div>

  <div class="left-upper"></div>
  <div class="right-upper"></div>

  <div class="left-lower"></div>
  <div class="right-lower"></div>

  <div class="pitch-wrap">

    <div class="pitch"></div>

    <div class="pitch-border"></div>

    <div class="half-line"></div>

    <div class="center-circle"></div>

    <div class="center-dot"></div>

  </div>

  <div id="flags"></div>

  <div class="front-rail"></div>

</main>

<div id="status" class="status">
  Connecting...
</div>

<div id="controls" class="controls">

  <button id="start" class="other">
    Start New Activity
  </button>

  <button id="refresh" class="other">
    Refresh
  </button>

  <button id="reveal" class="reveal">
    Reveal Flags
  </button>

  <button id="finalButton" class="other">
    Final Message
  </button>

  <button id="reset" class="other">
    Reset Display
  </button>

  <button id="hide" class="other">
    Hide Controls
  </button>

</div>

<div id="final" class="final">
  <div id="finalBox" class="final-box"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://oooanvnjvuwzsqocwzjs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4lDV3RGlIGFgNVHiTUvhhg_Gk0UFP-8";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   STATE
========================= */

let submissions = [];
let revealed = false;

const flagLayer =
  document.getElementById("flags");

const count =
  document.getElementById("count");

const statusBox =
  document.getElementById("status");


/* =========================
   STADIUM FLAG POSITIONS
========================= */

const positions = [];


/* BACK UPPER — 24 */

[
  {count:8,y:13,start:25,end:70,w:5.8,h:7},
  {count:8,y:21,start:23,end:72,w:6.2,h:7.5},
  {count:8,y:29,start:21,end:74,w:6.6,h:8}
]
.forEach(row => {

  for(let i=0;i<row.count;i++){

    const p =
      i/(row.count-1);

    positions.push({
      x:row.start +
        (row.end-row.start)*p,

      y:row.y,

      w:row.w,
      h:row.h
    });
  }
});


/* BACK LOWER — 15 */

[
  {count:8,y:37,start:22,end:73,w:7,h:8.5},
  {count:7,y:45,start:25,end:70,w:7.5,h:9}
]
.forEach(row => {

  for(let i=0;i<row.count;i++){

    const p =
      i/(row.count-1);

    positions.push({
      x:row.start +
        (row.end-row.start)*p,

      y:row.y,

      w:row.w,
      h:row.h
    });
  }
});


/* LEFT STANDS — 18 */

[
  {x:4,y:25},
  {x:10,y:28},
  {x:16,y:31},

  {x:3,y:36},
  {x:10,y:39},
  {x:17,y:42},

  {x:2,y:48},
  {x:9,y:51},
  {x:16,y:54},

  {x:2,y:60},
  {x:9,y:63},
  {x:16,y:66},

  {x:2,y:72},
  {x:9,y:75},
  {x:16,y:78},

  {x:3,y:84},
  {x:10,y:86},
  {x:17,y:88}
]
.forEach((p,i)=>{

  positions.push({
    x:p.x,
    y:p.y,
    w:7.5 + i*.08,
    h:9 + i*.06
  });
});


/* RIGHT STANDS — 18 */

[
  {x:88,y:25},
  {x:82,y:28},
  {x:76,y:31},

  {x:89,y:36},
  {x:82,y:39},
  {x:75,y:42},

  {x:90,y:48},
  {x:83,y:51},
  {x:76,y:54},

  {x:90,y:60},
  {x:83,y:63},
  {x:76,y:66},

  {x:90,y:72},
  {x:83,y:75},
  {x:76,y:78},

  {x:89,y:84},
  {x:82,y:86},
  {x:75,y:88}
]
.forEach((p,i)=>{

  positions.push({
    x:p.x,
    y:p.y,
    w:7.5 + i*.08,
    h:9 + i*.06
  });
});


/* TOTAL = 75 */


/* =========================
   PUBLIC IMAGE URL
========================= */

function imageURL(path){

  return db
    .storage
    .from("flags")
    .getPublicUrl(path)
    .data
    .publicUrl;
}


/* =========================
   LOAD
========================= */

async function loadFlags(){

  statusBox.textContent =
    "Loading flags...";

  const result =
    await db
      .from("submissions")
      .select(
        "id,created_at,name,image_path"
      )
      .order(
        "created_at",
        {ascending:true}
      );


  if(result.error){

    console.error(result.error);

    statusBox.textContent =
      "Unable to load flags.";

    return;
  }


  submissions =
    result.data || [];


  count.textContent =
    submissions.length;


  drawFlags();


  statusBox.textContent =
    "Connected";
}


/* =========================
   DRAW
========================= */

function drawFlags(){

  flagLayer.innerHTML = "";


  submissions
    .slice(0,75)
    .forEach(
      (submission,index)=>{

        const p =
          positions[index];

        if(!p){
          return;
        }


        const flag =
          document.createElement(
            "div"
          );


        flag.className =
          "flag";


        flag.style.left =
          p.x + "%";

        flag.style.top =
          p.y + "%";

        flag.style.width =
          p.w + "%";

        flag.style.height =
          p.h + "%";


        flag.innerHTML = `
          <div class="pole"></div>

          <div class="art">

            <img
              src="${imageURL(
                submission.image_path
              )}"
              alt="Participant flag"
            >

          </div>
        `;


        flagLayer.appendChild(
          flag
        );


        if(revealed){

          requestAnimationFrame(
            ()=>{
              flag.classList.add(
                "show"
              );
            }
          );
        }
      }
    );
}


/* =========================
   REVEAL
========================= */

function revealFlags(){

  revealed = true;


  document
    .querySelectorAll(".flag")
    .forEach(
      (flag,index)=>{

        setTimeout(
          ()=>{
            flag.classList.add(
              "show"
            );
          },

          index*85
        );
      }
    );


  document.getElementById(
    "reveal"
  ).textContent =
    "Flags Revealed";
}


/* =========================
   RESET
========================= */

function resetDisplay(){

  revealed = false;


  document
    .querySelectorAll(".flag")
    .forEach(
      flag=>{
        flag.classList.remove(
          "show"
        );
      }
    );


  document.getElementById(
    "reveal"
  ).textContent =
    "Reveal Flags";


  document.getElementById(
    "final"
  ).style.display =
    "none";
}


/* =========================
   LIVE SUBMISSIONS
========================= */

db
.channel("lwss-live")
.on(
  "postgres_changes",

  {
    event:"INSERT",
    schema:"public",
    table:"submissions"
  },

  payload=>{

    const exists =
      submissions.some(
        item=>
          item.id ===
          payload.new.id
      );


    if(exists){
      return;
    }


    submissions.push(
      payload.new
    );


    count.textContent =
      submissions.length;


    drawFlags();


    if(revealed){

      statusBox.textContent =
        "New flag added!";


      setTimeout(
        ()=>{
          statusBox.textContent =
            "Connected";
        },
        1500
      );
    }
  }
)
.subscribe();


/* =========================
   BUTTONS
========================= */

document
.getElementById("reveal")
.addEventListener(
  "click",
  revealFlags
);


document
.getElementById("refresh")
.addEventListener(
  "click",
  loadFlags
);


document
.getElementById("reset")
.addEventListener(
  "click",
  resetDisplay
);


document
.getElementById("start")
.addEventListener(
  "click",
  ()=>{
    resetDisplay();
    loadFlags();
  }
);


document
.getElementById("hide")
.addEventListener(
  "click",
  ()=>{

    document.getElementById(
      "controls"
    ).style.display =
      "none";

    statusBox.style.display =
      "none";
  }
);


document
.getElementById(
  "finalButton"
)
.addEventListener(
  "click",
  ()=>{

    /*
      Final wording has NOT
      been chosen yet.
    */

    document.getElementById(
      "finalBox"
    ).textContent =
      "";

    document.getElementById(
      "final"
    ).style.display =
      "flex";
  }
);


document
.getElementById("final")
.addEventListener(
  "click",
  ()=>{
    document.getElementById(
      "final"
    ).style.display =
      "none";
  }
);


/* =========================
   START
========================= */

loadFlags();

</script>

</body>
</html>
