<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LWSS Flag Stadium</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background:
    linear-gradient(
      to bottom,
      #78b8e4 0%,
      #cce7f5 17%,
      #e8edf0 17.2%,
      #18232c 18%,
      #0d151c 100%
    );
  color: #102c49;
}

/* =========================
   HEADER / SKY
========================= */

.sky {
  position: absolute;
  inset: 0 0 auto 0;
  height: 18%;
  overflow: hidden;
  background:
    radial-gradient(
      ellipse at 15% 60%,
      rgba(255,255,255,.8) 0 4%,
      transparent 11%
    ),
    radial-gradient(
      ellipse at 78% 35%,
      rgba(255,255,255,.7) 0 5%,
      transparent 12%
    ),
    linear-gradient(
      #62a9dc,
      #d7edf8
    );
}

.header {
  position: absolute;
  top: 2.5%;
  left: 0;
  width: 100%;
  text-align: center;
  z-index: 100;
}

.header h1 {
  margin: 0;
  color: #102d4a;
  font-size: clamp(30px, 3.3vw, 60px);
  font-weight: 800;
  letter-spacing: .3px;
}

.ready {
  display: inline-block;
  margin-top: 10px;
  padding: 7px 17px;
  border-radius: 30px;
  color: white;
  background: rgba(16,45,74,.88);
  font-size: clamp(13px,1.1vw,18px);
  font-weight: 700;
}

/* =========================
   STADIUM LIGHTS
========================= */

.lights {
  position: absolute;
  top: 15.2%;
  left: 2%;
  width: 96%;
  height: 4%;
  z-index: 25;
  border-radius: 50%;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 1.2%,
      #fff 1.25% 1.6%,
      transparent 1.65% 2.5%
    );
  filter: drop-shadow(0 0 7px white);
  opacity: .95;
}

/* =========================
   STADIUM
========================= */

.stadium {
  position: absolute;
  left: 2%;
  right: 2%;
  top: 17%;
  bottom: 1%;
  overflow: hidden;
  background: #131b22;
  border-radius: 42% 42% 5% 5% / 12% 12% 3% 3%;
  box-shadow:
    inset 0 15px 35px rgba(0,0,0,.7),
    0 15px 40px rgba(0,0,0,.5);
}

/* =========================
   BACK STAND
========================= */

.back-stand {
  position: absolute;
  top: 4%;
  left: 13%;
  width: 74%;
  height: 38%;
  clip-path: polygon(
    3% 0,
    97% 0,
    100% 100%,
    0 100%
  );
  background:
    repeating-linear-gradient(
      to bottom,
      #252f37 0 9px,
      #46535c 10px 14px,
      #161e24 15px 24px
    );
  border-bottom: 6px solid #78848b;
  z-index: 3;
}

/* =========================
   SIDE STANDS
========================= */

.left-stand {
  position: absolute;
  left: 0;
  top: 15%;
  width: 28%;
  height: 75%;
  clip-path: polygon(
    0 0,
    100% 25%,
    75% 100%,
    0 100%
  );
  background:
    repeating-linear-gradient(
      170deg,
      #1c252c 0 13px,
      #47535b 14px 19px,
      #11191f 20px 31px
    );
  z-index: 4;
}

.right-stand {
  position: absolute;
  right: 0;
  top: 15%;
  width: 28%;
  height: 75%;
  clip-path: polygon(
    0 25%,
    100% 0,
    100% 100%,
    25% 100%
  );
  background:
    repeating-linear-gradient(
      10deg,
      #1c252c 0 13px,
      #47535b 14px 19px,
      #11191f 20px 31px
    );
  z-index: 4;
}

/* =========================
   FIELD
========================= */

.field {
  position: absolute;
  left: 22%;
  top: 38%;
  width: 56%;
  height: 48%;
  z-index: 6;
  overflow: hidden;

  clip-path: polygon(
    12% 0,
    88% 0,
    100% 100%,
    0 100%
  );

  background:
    repeating-linear-gradient(
      90deg,
      #5d9c3f 0%,
      #5d9c3f 10%,
      #70aa4d 10%,
      #70aa4d 20%
    );

  box-shadow:
    0 0 0 3px white,
    0 15px 30px rgba(0,0,0,.45);
}

.field-lines {
  position: absolute;
  inset: 7% 7%;
  border: 2px solid rgba(255,255,255,.9);
}

.field-lines::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  height: 100%;
  border-left: 2px solid white;
}

.field-lines::after {
  content: "";
  position: absolute;
  width: 17%;
  aspect-ratio: 1;
  left: 41.5%;
  top: 50%;
  transform: translateY(-50%);
  border: 2px solid white;
  border-radius: 50%;
}

/* =========================
   FRONT STAND / RAILING
========================= */

.front-stand {
  position: absolute;
  left: 5%;
  bottom: 0;
  width: 90%;
  height: 17%;
  z-index: 12;

  background:
    repeating-linear-gradient(
      to bottom,
      #313d45 0 13px,
      #151d23 14px 28px
    );

  border-top: 6px solid #7b878d;
}

.front-rail {
  position: absolute;
  left: 3%;
  right: 3%;
  bottom: 15%;
  height: 6px;
  background: #aeb6ba;
  z-index: 40;
  box-shadow: 0 2px 4px rgba(0,0,0,.6);
}

/* =========================
   FLAG LAYER
========================= */

.flags-layer {
  position: absolute;
  inset: 0;
  z-index: 20;
  pointer-events: none;
}

.flag {
  position: absolute;
  opacity: 0;
  transform:
    translateY(65px)
    scale(.65);
  transform-origin: bottom left;

  transition:
    opacity .55s ease,
    transform .9s cubic-bezier(.2,.9,.25,1.15);
}

.flag.revealed {
  opacity: 1;
  transform:
    translateY(0)
    scale(1);
}

.flag-pole {
  position: absolute;
  left: -4px;
  top: -4px;
  width: 3px;
  height: calc(100% + 18px);
  background: #c5c9ca;
  border-radius: 2px;
  box-shadow: 1px 1px 3px rgba(0,0,0,.7);
}

.flag-art {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: white;
  border: 2px solid rgba(230,230,230,.9);
  box-shadow:
    2px 4px 7px rgba(0,0,0,.55);
  transform-origin: left center;
}

.flag-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.flag.revealed .flag-art {
  animation:
    flagWave 3.8s ease-in-out infinite;
}

@keyframes flagWave {

  0% {
    transform:
      perspective(600px)
      rotateY(0deg)
      skewY(0deg);
  }

  25% {
    transform:
      perspective(600px)
      rotateY(-4deg)
      skewY(.5deg);
  }

  50% {
    transform:
      perspective(600px)
      rotateY(2deg)
      skewY(-.3deg);
  }

  75% {
    transform:
      perspective(600px)
      rotateY(-2deg)
      skewY(.3deg);
  }

  100% {
    transform:
      perspective(600px)
      rotateY(0deg)
      skewY(0deg);
  }
}

/* =========================
   CONTROLS
========================= */

.controls {
  position: fixed;
  right: 14px;
  bottom: 12px;
  z-index: 200;

  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 7px;

  max-width: 700px;

  padding: 9px;

  background: rgba(8,20,30,.88);
  border-radius: 12px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.4);
}

.controls button {
  border: 0;
  border-radius: 8px;
  padding: 10px 13px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
}

.gold {
  background: #d2aa4d;
  color: #172a3a;
}

.light {
  background: #eef2f4;
  color: #18324a;
}

.status {
  position: fixed;
  left: 12px;
  bottom: 10px;
  z-index: 200;
  color: white;
  background: rgba(5,15,23,.8);
  border-radius: 8px;
  padding: 7px 11px;
  font-size: 12px;
}

/* =========================
   FINAL MESSAGE OVERLAY
========================= */

.final-overlay {
  position: fixed;
  inset: 0;
  z-index: 500;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(7,20,31,.75);
}

.final-card {
  width: min(800px,85vw);
  min-height: 220px;
  padding: 40px;

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  border-radius: 22px;
  background: rgba(255,255,255,.96);

  color: #15334f;
  font-size: clamp(25px,3vw,48px);
  font-weight: 800;

  box-shadow:
    0 20px 60px rgba(0,0,0,.45);
}

@media (max-width: 800px) {

  .back-stand {
    left: 8%;
    width: 84%;
  }

  .field {
    left: 18%;
    width: 64%;
  }

}
</style>
</head>

<body>

<div class="sky"></div>

<header class="header">

  <h1>
    Different roles. Diverse strengths.
  </h1>

  <div class="ready">
    Flags Ready:
    <span id="flagCount">0</span>
  </div>

</header>

<div class="lights"></div>

<main class="stadium">

  <div class="back-stand"></div>

  <div class="left-stand"></div>

  <div class="right-stand"></div>

  <div class="field">
    <div class="field-lines"></div>
  </div>

  <div class="front-stand"></div>

  <div
    id="flagsLayer"
    class="flags-layer">
  </div>

  <div class="front-rail"></div>

</main>


<div
  id="status"
  class="status">
  Connecting...
</div>


<div
  id="controls"
  class="controls">

  <button
    id="startButton"
    class="light">
    Start New Activity
  </button>

  <button
    id="refreshButton"
    class="light">
    Refresh
  </button>

  <button
    id="revealButton"
    class="gold">
    Reveal Flags
  </button>

  <button
    id="finalButton"
    class="light">
    Final Message
  </button>

  <button
    id="resetButton"
    class="light">
    Reset Display
  </button>

  <button
    id="hideButton"
    class="light">
    Hide Controls
  </button>

</div>


<div
  id="finalOverlay"
  class="final-overlay">

  <div
    id="finalCard"
    class="final-card">
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://oooanvnjvuwzsqocwzjs.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4lDV3RGlIGFgNVHiTUvhhg_Gk0UFP-8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   ELEMENTS
========================= */

const flagsLayer =
  document.getElementById("flagsLayer");

const flagCount =
  document.getElementById("flagCount");

const statusBox =
  document.getElementById("status");

const controls =
  document.getElementById("controls");

const revealButton =
  document.getElementById("revealButton");

const refreshButton =
  document.getElementById("refreshButton");

const startButton =
  document.getElementById("startButton");

const finalButton =
  document.getElementById("finalButton");

const resetButton =
  document.getElementById("resetButton");

const hideButton =
  document.getElementById("hideButton");

const finalOverlay =
  document.getElementById("finalOverlay");

const finalCard =
  document.getElementById("finalCard");


let submissions = [];

let revealed = false;


/* =========================
   FLAG POSITIONS
========================= */

const positions = [];


/* BACK STAND — 42 FLAGS */

const backRows = [
  {
    count: 12,
    y: 8,
    start: 19,
    end: 75,
    width: 5.7,
    height: 7.3
  },

  {
    count: 11,
    y: 16,
    start: 21,
    end: 74,
    width: 6,
    height: 7.6
  },

  {
    count: 10,
    y: 24,
    start: 23,
    end: 72,
    width: 6.3,
    height: 8
  },

  {
    count: 9,
    y: 32,
    start: 25,
    end: 70,
    width: 6.7,
    height: 8.4
  }
];


backRows.forEach(
  function(row) {

    for (
      let i = 0;
      i < row.count;
      i++
    ) {

      const progress =
        row.count === 1
          ? 0
          : i / (row.count - 1);

      positions.push({

        x:
          row.start +
          (
            row.end -
            row.start
          ) *
          progress,

        y: row.y,

        width: row.width,

        height: row.height,

        layer: 20
      });
    }
  }
);


/* LEFT STAND — 13 FLAGS */

for (
  let i = 0;
  i < 13;
  i++
) {

  const row =
    Math.floor(i / 3);

  const column =
    i % 3;

  positions.push({

    x:
      3 +
      column * 6 +
      row * 1.1,

    y:
      25 +
      row * 12,

    width:
      7.2 +
      row * .5,

    height:
      9 +
      row * .5,

    layer:
      30 + row
  });
}


/* RIGHT STAND — 13 FLAGS */

for (
  let i = 0;
  i < 13;
  i++
) {

  const row =
    Math.floor(i / 3);

  const column =
    i % 3;

  positions.push({

    x:
      79 +
      column * 6 -
      row * 1.1,

    y:
      25 +
      row * 12,

    width:
      7.2 +
      row * .5,

    height:
      9 +
      row * .5,

    layer:
      30 + row
  });
}


/* FRONT STAND — 7 FLAGS */

for (
  let i = 0;
  i < 7;
  i++
) {

  positions.push({

    x:
      13 +
      i * 11.5,

    y: 84,

    width: 9.5,

    height: 11,

    layer: 60
  });
}


/* =========================
   IMAGE URL
========================= */

function getFlagURL(path) {

  return supabaseClient
    .storage
    .from("flags")
    .getPublicUrl(path)
    .data
    .publicUrl;
}


/* =========================
   LOAD FLAGS
========================= */

async function loadFlags() {

  statusBox.textContent =
    "Loading flags...";

  const result =
    await supabaseClient
      .from("submissions")
      .select(
        "id,created_at,name,image_path"
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (result.error) {

    console.error(result.error);

    statusBox.textContent =
      "Unable to load flags.";

    return;
  }


  submissions =
    result.data || [];


  flagCount.textContent =
    submissions.length;


  renderFlags();


  statusBox.textContent =
    "Connected";
}


/* =========================
   DRAW FLAGS
========================= */

function renderFlags() {

  flagsLayer.innerHTML = "";


  submissions
    .slice(0,75)
    .forEach(
      function(submission,index) {

        const position =
          positions[index];

        if (!position) {
          return;
        }


        const flag =
          document.createElement("div");


        flag.className =
          "flag";


        flag.style.left =
          position.x + "%";

        flag.style.top =
          position.y + "%";

        flag.style.width =
          position.width + "%";

        flag.style.height =
          position.height + "%";

        flag.style.zIndex =
          position.layer;


        flag.innerHTML = `
          <div class="flag-pole"></div>

          <div class="flag-art">

            <img
              src="${getFlagURL(
                submission.image_path
              )}"
              alt="Participant flag"
            >

          </div>
        `;


        flagsLayer.appendChild(
          flag
        );


        if (revealed) {

          requestAnimationFrame(
            function() {

              flag.classList.add(
                "revealed"
              );

            }
          );
        }
      }
    );
}


/* =========================
   REVEAL
========================= */

function revealFlags() {

  revealed = true;


  const flags =
    document.querySelectorAll(
      ".flag"
    );


  flags.forEach(
    function(flag,index) {

      setTimeout(
        function() {

          flag.classList.add(
            "revealed"
          );

        },

        index * 90
      );
    }
  );


  revealButton.textContent =
    "Flags Revealed";
}


/* =========================
   RESET DISPLAY
========================= */

function resetDisplay() {

  revealed = false;

  finalOverlay.style.display =
    "none";


  document
    .querySelectorAll(".flag")
    .forEach(
      function(flag) {

        flag.classList.remove(
          "revealed"
        );
      }
    );


  revealButton.textContent =
    "Reveal Flags";
}


/* =========================
   START NEW ACTIVITY
========================= */

function startNewActivity() {

  resetDisplay();

  loadFlags();
}


/* =========================
   FINAL MESSAGE

   Intentionally blank until wording
   is approved.
========================= */

function showFinalMessage() {

  finalCard.textContent =
    "Final message will go here.";

  finalOverlay.style.display =
    "flex";
}


/* =========================
   REALTIME
========================= */

supabaseClient
  .channel(
    "lwss-live-flags"
  )

  .on(
    "postgres_changes",

    {
      event: "INSERT",
      schema: "public",
      table: "submissions"
    },

    function(payload) {

      const exists =
        submissions.some(
          function(item) {

            return (
              item.id ===
              payload.new.id
            );
          }
        );


      if (exists) {
        return;
      }


      submissions.push(
        payload.new
      );


      flagCount.textContent =
        submissions.length;


      renderFlags();


      if (revealed) {

        statusBox.textContent =
          "New flag added!";


        setTimeout(
          function() {

            statusBox.textContent =
              "Connected";

          },
          1800
        );
      }
    }
  )

  .subscribe();


/* =========================
   BUTTONS
========================= */

revealButton.addEventListener(
  "click",
  revealFlags
);


refreshButton.addEventListener(
  "click",
  loadFlags
);


resetButton.addEventListener(
  "click",
  resetDisplay
);


startButton.addEventListener(
  "click",
  startNewActivity
);


finalButton.addEventListener(
  "click",
  showFinalMessage
);


hideButton.addEventListener(
  "click",
  function() {

    controls.style.display =
      "none";

    statusBox.style.display =
      "none";
  }
);


finalOverlay.addEventListener(
  "click",
  function() {

    finalOverlay.style.display =
      "none";
  }
);


/* =========================
   START
========================= */

loadFlags();

</script>

</body>
</html>
